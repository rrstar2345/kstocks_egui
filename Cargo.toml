[package]
name = "kstocks"
version = "0.1.0"
description = "KSTOCKS standalone Rust + egui desktop app"
edition = "2021"

[dependencies]
# Core egui GUI
eframe = "0.36"
egui = "0.36"
egui_plot = "0.37"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
dirs = "6.0.0"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "macros", "chrono"] }

# HTTP & WebSocket
reqwest = { version = "0.12", features = ["json", "cookies"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3.32"
urlencoding = "2.1"
